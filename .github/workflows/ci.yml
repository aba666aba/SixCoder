name: CI

# 为什么要有这个：这台机器上的 72 项自检/闸门，过去全靠人工记得跑。
# 现在任何 push 与 PR 都会自动跑：自检（含反例）、前端构建、文档链接、密钥扫描。
# 判据是硬门——绿了才算改对，和 docs/16 的"证据说话"是同一套原则。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 自检（${{ matrix.os }} / py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            prototype/requirements.txt
            prototype/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototype/web/package-lock.json

      - name: 安装依赖（锁定版本）
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r prototype/requirements.txt -r prototype/requirements-dev.txt

      # 前端产物不入库（dist/ 在 .gitignore 里），而 check_ui_build 要读 dist/assets。
      # 所以自检前必须在**同一个作业**里先构建，否则干净检出跑自检必红（CI 首次就是这么红的）。
      - name: 构建前端产物（自检要用 dist）
        working-directory: prototype/web
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html || (echo "dist/index.html 缺失" && exit 1)

      - name: 语法编译（全仓 Python）
        run: python -m compileall -q prototype

      - name: 自检套件（72 项脚本，含反例）
        working-directory: prototype
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python checks/run_all.py

      # 独立验收（hq_verify）需要一个真实工作区；工作区是生成产物、不入库，
      # 因此这一步改到"README 里写的用法"上（跑生成出来的项目时手动执行），
      # CI 不再引用仓库里不存在的 projects/*。
      - name: 依赖卫生（必须锁死版本，且没有已知漏洞）
        working-directory: prototype
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from core import gates
          r = gates.gate_deps(".")
          print(r.gate, r.ok, r.detail)
          raise SystemExit(0 if r.ok else 1)
          PY

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototype/web/package-lock.json
      - name: 安装与构建
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run build
      - name: 产物存在性检查
        run: |
          test -f dist/index.html || (echo "dist/index.html 缺失" && exit 1)
          ls -la dist/assets

  guards:
    name: 守卫（密钥 / 文档链接 / 提交规范）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 明文密钥扫描（本仓库历史里踩过这个坑）
        run: |
          # 已轮换的旧 key 只允许出现在 tools/git-hooks/.known-old-secrets 里
          allow_file="tools/git-hooks/.known-old-secrets"
          hits=$(git grep -nIE 'sk-[0-9a-f]{20,}' -- . ':!*.md' ':!*lock*' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            bad=0
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              sha=${line%%:*}
              if [ -f "$allow_file" ] && grep -q "^$sha" "$allow_file"; then
                echo "  跳过已轮换提交 $sha"
              else
                bad=1
              fi
            done <<< "$hits"
            if [ "$bad" = "1" ]; then
              echo "发现疑似明文密钥，且不在已轮换白名单里"
              exit 1
            fi
          fi
          echo "密钥扫描通过"
      - name: 不该入库的文件
        run: |
          bad=$(git ls-files | grep -E 'prototype/data/(settings\.json|proto\.db|api_index\.db)|llm-config\.yml|node_modules/|__pycache__/|\.sixcoder/' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "索引干净"
      - name: 文档链接
        working-directory: prototype
        env:
          PYTHONIOENCODING: utf-8
        run: python checks/check_links.py
