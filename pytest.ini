[pytest]
testpaths = tests
pythonpath = prototype
# 默认排除 slow（229 个自检，全跑 15-20 分钟）。
# 但 tests/test_all_checks.py 里的 test_scripts_discovered 不是 slow，要能跑到。
# 用 -m "not slow" 排除整个文件里的 slow 用例，其他照跑。
addopts = -q -m "not slow"

markers =
    slow: 全量自检（229 个脚本，15-20 分钟），跑法：pytest -m slow tests/test_all_checks.py
